<!-- ─────────────────────────────────────────────────
     Script — auto-executes when topic is loaded
     (enhanced-script.js calls executeScripts() after innerHTML)
───────────────────────────────────────────────── -->
<script>
(function () {
  /* ── Example snippets ─── */
  const EXAMPLES = {
    hello: `print("Hello, World!")
print("Welcome to Python! 🐍")`,
    vars: `# Variables & Math
name = "Python"
version = 3.12
year = 1991

print(f"Language: {name}")
print(f"Version: {version}")
print(f"Created: {year}")
print(f"Age: {2025 - year} years old")`,
    list: `# List Operations
fruits = ["apple", "banana", "cherry", "mango"]

print("All fruits:", fruits)
print("First:", fruits[0])
print("Last:", fruits[-1])

fruits.append("orange")
fruits.remove("banana")
print("After changes:", fruits)
print("Count:", len(fruits))`,
    loop: `# For Loop Patterns
# Range loop
for i in range(1, 6):
    print(f"Count: {i}")

# Loop over list
colors = ["red", "green", "blue"]
for color in colors:
    print(f"Color → {color}")

# Enumerate
for idx, val in enumerate(colors, 1):
    print(f"  {idx}. {val}")`,
    func: `# Functions
def greet(name, greeting="Hello"):
    return f"{greeting}, {name}!"

def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

print(greet("World"))
print(greet("Python", "Hey"))

for n in range(1, 8):
    print(f"{n}! = {factorial(n)}")`,
    class: `# Object-Oriented Programming
class Animal:
    def __init__(self, name, sound):
        self.name = name
        self.sound = sound

    def speak(self):
        return f"{self.name} says {self.sound}!"

    def __str__(self):
        return f"Animal({self.name})"

dog = Animal("Dog", "Woof")
cat = Animal("Cat", "Meow")

print(dog.speak())
print(cat.speak())
print(str(dog))`,
    fib: `# Fibonacci Sequence
def fibonacci(n):
    a, b = 0, 1
    result = []
    for _ in range(n):
        result.append(a)
        a, b = b, a + b
    return result

fib = fibonacci(12)
print("Fibonacci sequence:")
print(fib)

# With index
for i, val in enumerate(fib):
    bar = "█" * (val if val < 30 else 29)
    print(f"F({i:2d}) = {val:4d}  {bar}")`,
  };

  /* ── State ─── */
  let runCount   = parseInt(localStorage.getItem('compilerRuns') || '0');
  let totalXP    = parseInt(localStorage.getItem('compilerXP')   || '0');
  let skulptReady = typeof Sk !== 'undefined';

  /* ── DOM refs ─── */
  const codeEl     = document.getElementById('python-code');
  const outputEl   = document.getElementById('output');
  const runBtn     = document.getElementById('run-btn');
  const clearBtn   = document.getElementById('clear-btn');
  const exToggle   = document.getElementById('example-toggle');
  const exDrop     = document.getElementById('examplesDrop');
  const copyOutBtn = document.getElementById('copy-out');
  const clearOutBtn= document.getElementById('clear-out');
  const runCountEl = document.getElementById('runCount');
  const lineCountEl= document.getElementById('lineCount');
  const lineNumsEl = document.getElementById('lineNumbers');
  const xpBadgeEl  = document.getElementById('compilerXP');
  const execTimeEl = document.getElementById('execTime');

  /* ── Line numbers ─── */
  function updateLineNumbers() {
    const lines = codeEl.value.split('\n').length;
    lineNumsEl.textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
    if (lineCountEl) lineCountEl.textContent = lines + (lines === 1 ? ' line' : ' lines');
  }

  /* ── XP system ─── */
  function addXP(amount) {
    totalXP += amount;
    localStorage.setItem('compilerXP', totalXP);
    if (xpBadgeEl) {
      xpBadgeEl.textContent = '⚡ XP ' + totalXP;
      xpBadgeEl.classList.add('flash');
      setTimeout(() => xpBadgeEl.classList.remove('flash'), 800);
    }
  }

  /* ── Update run count ─── */
  function updateRunCount() {
    runCount++;
    localStorage.setItem('compilerRuns', runCount);
    if (runCountEl) runCountEl.textContent = runCount + (runCount === 1 ? ' run' : ' runs');
  }

  /* ── Set output state ─── */
  function setOutput(text, state) {
    outputEl.textContent = text;
    outputEl.className = 'terminal-out out-' + state;
  }

  /* ── Run code ─── */
  function runCode() {
    const code = codeEl.value.trim();
    if (!code) { setOutput('No code to run.', 'info'); return; }

    if (typeof Sk === 'undefined') {
      setOutput('Skulpt not loaded. Check your internet connection and refresh.', 'error');
      return;
    }

    setOutput('Running…', 'running');
    updateRunCount();

    let outputBuffer = '';
    const startTime = performance.now();

    Sk.configure({
      output: function (text) { outputBuffer += text; },
      read: function (x) {
        if (Sk.builtinFiles?.files?.[x] === undefined)
          throw "File not found: '" + x + "'";
        return Sk.builtinFiles.files[x];
      },
      execLimit: 10000,
    });

    Sk.misceval.asyncToPromise(function () {
      return Sk.importMainWithBody('<stdin>', false, code, true);
    }).then(function () {
      const ms = Math.round(performance.now() - startTime);
      setOutput(outputBuffer || '(no output)', 'success');
      if (execTimeEl) execTimeEl.textContent = ms + 'ms';
      addXP(5 + Math.floor(code.split('\n').length / 5));
      // global achievement hook
      if (typeof awardAchievement === 'function') awardAchievement('compiler');
    }).catch(function (err) {
      const ms = Math.round(performance.now() - startTime);
      setOutput('Error: ' + (err.toString() || 'Unknown error'), 'error');
      if (execTimeEl) execTimeEl.textContent = ms + 'ms';
    });
  }

  /* ── Clear editor ─── */
  function clearEditor() {
    codeEl.value = '';
    updateLineNumbers();
    codeEl.focus();
  }

  /* ── Examples dropdown ─── */
  exToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    exDrop.classList.toggle('open');
  });

  document.addEventListener('click', function () {
    exDrop.classList.remove('open');
  });

  exDrop.querySelectorAll('li').forEach(function (li) {
    li.addEventListener('click', function () {
      const key = this.getAttribute('data-ex');
      if (EXAMPLES[key]) {
        codeEl.value = EXAMPLES[key];
        updateLineNumbers();
        exDrop.classList.remove('open');
        codeEl.focus();
      }
    });
  });

  /* ── Copy output ─── */
  if (copyOutBtn) {
    copyOutBtn.addEventListener('click', function () {
      navigator.clipboard.writeText(outputEl.textContent || '').then(function () {
        copyOutBtn.textContent = '✓ Copied';
        setTimeout(function () { copyOutBtn.textContent = '⎘ Copy'; }, 1500);
      });
    });
  }

  /* ── Clear output ─── */
  if (clearOutBtn) {
    clearOutBtn.addEventListener('click', function () {
      setOutput('Ready to run Python code…', 'ready');
      if (execTimeEl) execTimeEl.textContent = '';
    });
  }

  /* ── Tab key → insert spaces ─── */
  codeEl.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, s) + '    ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = s + 4;
      updateLineNumbers();
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      runCode();
    }
  });

  codeEl.addEventListener('input', updateLineNumbers);
  runBtn.addEventListener('click', runCode);
  clearBtn.addEventListener('click', clearEditor);

  /* ── Init ─── */
  updateLineNumbers();
  if (runCountEl) runCountEl.textContent = runCount + (runCount === 1 ? ' run' : ' runs');
  if (xpBadgeEl)  xpBadgeEl.textContent  = '⚡ XP ' + totalXP;

})();
</script>
